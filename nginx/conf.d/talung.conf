upstream talung_backend {
    server web:3000;
    keepalive 32;
}

# Cấu hình máy chủ phục vụ mạng nội bộ (HTTP / HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Bổ sung các Header an ninh chuẩn
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Áp dụng giới hạn tần suất truy vấn
    limit_req zone=talung_limit burst=50 nodelay;

    # Tối ưu bộ nhớ đệm cho tài nguyên tĩnh của Next.js
    location /_next/static/ {
        proxy_pass http://talung_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Tài nguyên tĩnh trong public/
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        proxy_pass http://talung_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Toàn bộ API và giao diện Web
    location / {
        proxy_pass http://talung_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Thời gian chờ cho các tác vụ xuất Excel dung lượng lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
